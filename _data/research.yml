- title: "2-Group Belyi Maps"
  venue: "Ph.D. thesis, Dartmouth College"
  year: 2019
  description: >-
    Galois Belyi maps with monodromy group a 2-group. Develops computational
    methods to enumerate and study their structure.
  award: "Selfridge Prize (for the related database paper)"
  links:
