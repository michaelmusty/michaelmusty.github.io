- id: three-point-branched-covers
  title: "Numerical calculation of three-point branched covers of the projective line"
  kind: paper
  authors: "with Michael Klug, Sam Schiavone, and John Voight"
  venue: "LMS Journal of Computation and Mathematics 17(1), 379–430"
  year: 2014
  summary: >-
    A general numerical method for computing Belyi maps from power series
    expansions of modular forms. I wrote the code that draws Belyi maps as
    dessins d'enfants conformally embedded in the hyperbolic unit disk.
  links:
    - { name: "arXiv", url: "https://arxiv.org/abs/1311.2081" }
    - { name: "PDF", url: "/assets/belyi.pdf" }
