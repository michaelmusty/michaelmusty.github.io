# Papers and thesis. Add an entry here and it appears on Home, Research and CV.
# Fields: id, title, kind (paper | thesis), authors, venue, year, summary, award, links.

- id: belyi-database
  title: "A database of Belyi maps"
  kind: paper
  authors: "with Sam Schiavone, Jeroen Sijsling, and John Voight"
  venue: "Proceedings of ANTS-XIII, The Open Book Series 2, Mathematical Sciences Publishers"
  year: 2019
  award: "Selfridge Prize in Number Theory, ANTS-XIII"
  summary: >-
    Computes a database of thousands of Belyi maps up to degree 9. I implemented
    the database backend in Magma and worked in a team of four to migrate the
    data into the L-functions and Modular Forms Database (LMFDB).
  links:
    - { name: "Article", url: "https://msp.org/obs/2019/2-1/p23.xhtml" }
    - { name: "arXiv", url: "https://arxiv.org/abs/1805.07751" }
    - { name: "Code", url: "https://github.com/michaelmusty/BelyiDB" }
    - { name: "LMFDB", url: "https://www.lmfdb.org/Belyi/" }

- id: two-group-belyi-maps
  title: "2-group Belyi maps"
  kind: thesis
  venue: "Ph.D. thesis, Dartmouth College"
  year: 2019
  summary: >-
    A study of Galois Belyi maps whose monodromy group is a 2-group, with
    algorithms to enumerate and compute them.
  links:
    - { name: "Thesis", url: "/assets/musty_thesis_final.pdf" }
    - { name: "Defense slides", url: "/assets/MUSTY_THESIS_DEFENSE.pdf" }
    - { name: "Code", url: "https://github.com/michaelmusty/2groupdessins" }

- id: cost-of-dermatologic-care
  title: "Understanding the cost of dermatologic care: a survey study of dermatology providers, residents, and patients"
  kind: paper
